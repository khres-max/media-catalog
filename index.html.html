    const catalog = document.getElementById('catalog');
    const tooltip = document.getElementById('tooltip');
    const selected = document.getElementById('selected');

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function tooltipContent(item) {
      return '<span class="tooltip-name">' + esc(item.name) + '</span><br>'
        + 'Країна: ' + esc(item.country);
    }

    rows.forEach(function (row) {
      const rowElement = document.createElement('div');
      rowElement.className = 'media-row';
      rowElement.style.width = row.width + 'px';
      rowElement.style.gap = row.gap + 'px';

      row.items.forEach(function (item) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'media-item';
        button.textContent = item.name;
        button.style.color = item.color;
        button.setAttribute('aria-label', item.name + ', ' + item.country);

        button.addEventListener('mouseenter', function () {
          tooltip.innerHTML = tooltipContent(item);
          tooltip.style.display = 'block';
        });

        button.addEventListener('mousemove', function (event) {
          const offset = 14;
          const tooltipWidth = tooltip.offsetWidth;
          const tooltipHeight = tooltip.offsetHeight;
          let x = event.clientX + offset;
          let y = event.clientY + offset;

          if (x + tooltipWidth > window.innerWidth - 8) {
            x = event.clientX - tooltipWidth - offset;
          }
          if (y + tooltipHeight > window.innerHeight - 8) {
            y = event.clientY - tooltipHeight - offset;
          }

          tooltip.style.left = x + 'px';
          tooltip.style.top = y + 'px';
        });

        button.addEventListener('mouseleave', function () {
          tooltip.style.display = 'none';
        });

        button.addEventListener('focus', function () {
          tooltip.innerHTML = tooltipContent(item);
        });

        button.addEventListener('click', function () {
          selected.innerHTML = '<span class="selected-name">'
            + esc(item.name) + '</span> — ' + esc(item.country) + '.';
          selected.style.display = 'block';
        });

        rowElement.appendChild(button);
      });

      catalog.appendChild(rowElement);
    });
  </script>
